ss="muted">支持周期班次、批量排班、换班和冲</text></g><g transform="translate(320,400)"><rect width="240" height="120" rx="12" class="card"/><text x="20" y="38" class="small">CLOCK</text><text x="20" y="70" class="title">打卡记录</text><text x="20" y="96" class="muted">接收移动端、门禁、考勤机和补签数</text></g><g transform="translate(590,400)"><rect width="240" height="120" rx="12" class="card"/><text x="20" y="38" class="small">LEAVE</text><text x="20" y="70" class="title">休假出差</text><text x="20" y="96" class="muted">管理假期额度、请假、出差、销假和</text></g><g transform="translate(860,400)"><rect width="240" height="120" rx="12" class="card"/><text x="20" y="38" class="small">OVERTIME</text><text x="20" y="70" class="title">加班管理</text><text x="20" y="96" class="muted">执行申请、审批、调休或加班费结转</text></g><text x="320" y="655" class="sub">界面示意 · 上海如静知华信息科技有限公司 · https://www.zhuatech.cn/</text></svg>